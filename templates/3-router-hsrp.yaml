lab:
  title: 3 Routers HSRP
  version: 0.3.0
  description: R1/R2 share HSRP gateway 192.168.10.1 for the LAN; R3 is the upstream/WAN router reachable via both (OSPF)
  notes: |-
    LAN 192.168.10.0/24  VIP 192.168.10.1  R1 .2 (pri 110, active)  R2 .3 (pri 100, standby)  PC1 .10
    R1-R3 10.0.13.0/30, R2-R3 10.0.23.0/30, R3 Loopback0 3.3.3.3 = "internet" test address
    R1 tracks its uplink Gi0/1: if it drops, priority -20 -> R2 takes over
    Login: admin / cisco
nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: -200
    y: 0
    configuration: |-
      hostname R1
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      track 1 interface GigabitEthernet0/1 line-protocol
      interface GigabitEthernet0/0
       description LAN
       ip address 192.168.10.2 255.255.255.0
       standby version 2
       standby 10 ip 192.168.10.1
       standby 10 priority 110
       standby 10 preempt
       standby 10 timers 1 3
       standby 10 authentication md5 key-string HSRPkey
       standby 10 track 1 decrement 20
       no shutdown
      interface GigabitEthernet0/1
       description UPLINK-to-R3
       ip address 10.0.13.1 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      router ospf 1
       router-id 1.1.1.1
       network 192.168.10.0 0.0.0.255 area 0
       network 10.0.13.0 0.0.0.3 area 0
      line con 0
       logging synchronous
       exec-timeout 0 0
      line vty 0 4
       login local
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
  - id: n1
    label: R2
    node_definition: iosv
    x: 200
    y: 0
    configuration: |-
      hostname R2
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      interface GigabitEthernet0/0
       description LAN
       ip address 192.168.10.3 255.255.255.0
       standby version 2
       standby 10 ip 192.168.10.1
       standby 10 priority 100
       standby 10 preempt
       standby 10 timers 1 3
       standby 10 authentication md5 key-string HSRPkey
       no shutdown
      interface GigabitEthernet0/1
       description UPLINK-to-R3
       ip address 10.0.23.1 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      router ospf 1
       router-id 2.2.2.2
       network 192.168.10.0 0.0.0.255 area 0
       network 10.0.23.0 0.0.0.3 area 0
      line con 0
       logging synchronous
       exec-timeout 0 0
      line vty 0 4
       login local
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
  - id: n2
    label: R3
    node_definition: iosv
    x: 0
    y: -250
    configuration: |-
      hostname R3
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
      interface GigabitEthernet0/0
       description to-R1
       ip address 10.0.13.2 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      interface GigabitEthernet0/1
       description to-R2
       ip address 10.0.23.2 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      router ospf 1
       router-id 3.3.3.3
       network 3.3.3.3 0.0.0.0 area 0
       network 10.0.13.0 0.0.0.3 area 0
       network 10.0.23.0 0.0.0.3 area 0
      line con 0
       logging synchronous
       exec-timeout 0 0
      line vty 0 4
       login local
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
  - id: n3
    label: LAN-SW
    node_definition: unmanaged_switch
    x: 0
    y: 200
    interfaces:
      - {id: i0, label: port0, slot: 0, type: physical}
      - {id: i1, label: port1, slot: 1, type: physical}
      - {id: i2, label: port2, slot: 2, type: physical}
  - id: n4
    label: PC1
    node_definition: alpine
    x: 0
    y: 350
    configuration: |-
      hostname PC1
      ip addr add 192.168.10.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 192.168.10.1
    interfaces:
      - {id: i0, label: eth0, slot: 0, type: physical}
links:
  - {id: l0, n1: n0, i1: i0, n2: n3, i2: i0}
  - {id: l1, n1: n1, i1: i0, n2: n3, i2: i1}
  - {id: l2, n1: n4, i1: i0, n2: n3, i2: i2}
  - {id: l3, n1: n0, i1: i1, n2: n2, i2: i0}
  - {id: l4, n1: n1, i1: i1, n2: n2, i2: i1}
