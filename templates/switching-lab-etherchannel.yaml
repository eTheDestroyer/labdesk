lab:
  description: 'SW1/SW2 IOSvL2 with two parallel EtherChannels: Po1 LACP (active/passive) and Po2 PAgP (desirable/auto); STP
    blocks Po2 as a whole. R1 router-on-a-stick + Internet cloud, PC1/PC2'
  notes: 'Po1 LACP  SW1 Gi0/1+Gi0/2 active  <-> SW2 passive   trunk 10,20

    Po2 PAgP  SW1 Gi1/0+Gi1/1 desirable <-> SW2 auto  trunk 10,20 (SW2 Po2 Altn BLK)

    port-channel load-balance src-dst-ip; SW1 STP root for VLAN 10,20

    VLAN 10 USERS 192.168.10.0/24 (PC1 .10), VLAN 20 SERVERS 192.168.20.0/24 (PC2 .10), R1 .1 gateways

    R1 Gi0/1 100.64.0.2/24 -> INTERNET cloud (LabDesk host service), default via 100.64.0.1

    Login: admin / cisco, enable secret cisco'
  title: Switching Lab (EtherChannel)
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
