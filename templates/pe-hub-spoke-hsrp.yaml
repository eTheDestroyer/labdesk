nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname HUB
          ! no service config: don't try to load configs over TFTP (belt-and-braces: Gi0/0 is an isolated link now)
          no service config
          no ip domain lookup
          ip domain name lab.local
          username admin privilege 15 secret cisco
          enable secret cisco
          !
          interface Loopback10
           description HUB LAN 192.168.10.0/24 (simulated with a loopback)
           ip address 192.168.10.1 255.255.255.0
          !
          interface GigabitEthernet0/0
           description WAN to PE ge-0/0/0 (via CML connector BR-PE-HUB, isolated link; PE routing-instance CUSTOMER)
           ip address 10.1.1.2 255.255.255.252
           no ip proxy-arp
           no shutdown
          !
          ! --- prefix-lists = the BGP filters ---
          ip prefix-list HUB-LAN seq 10 permit 192.168.10.0/24
          ip prefix-list BRANCH-LANS seq 10 permit 172.16.0.0/24
          ip prefix-list BRANCH-LANS seq 20 permit 192.168.20.0/24
          !
          router bgp 65100
           bgp router-id 192.168.10.1
           bgp log-neighbor-changes
           network 192.168.10.0 mask 255.255.255.0
           neighbor 10.1.1.1 remote-as 65000
           neighbor 10.1.1.1 description PE (vrf CUSTOMER)
           neighbor 10.1.1.1 timers 5 15
           neighbor 10.1.1.1 prefix-list BRANCH-LANS in
           neighbor 10.1.1.1 prefix-list HUB-LAN out
          !
          ! Belt-and-braces (written when Gi0/0 sat on virbr0 with libvirt DHCP; the link is isolated now):
          ! first boot after a wipe (empty NVRAM): IOS AutoInstall could take a DHCP lease on Gi0/0
          ! and replaces the WAN address, and the SSH key does not exist yet. When CML's day-0 loader logs
          ! CVAC-4-CONFIG_DONE (AutoInstall is over by then), this applet puts the WAN address back,
          ! creates the RSA key for SSH (answers "no" if one already exists) and saves.
          event manager applet LAB-DAY0-FIX
           event syslog pattern "CVAC-4-CONFIG_DONE" maxrun 240
           action 1.0 cli command "enable"
           action 2.0 cli command "configure terminal"
           action 3.0 cli command "interface GigabitEthernet0/0"
           action 3.1 cli command "ip address 10.1.1.2 255.255.255.252"
           action 3.2 cli command "exit"
           action 4.0 cli command "crypto key generate rsa general-keys modulus 2048" pattern "yes/no|#"
           action 4.1 cli command "no"
           action 5.0 cli command "ip ssh version 2"
           action 6.0 cli command "end"
           action 7.0 cli command "write memory"
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           exec-timeout 30 0
           logging synchronous
           login local
           transport input ssh telnet
          !
          end
