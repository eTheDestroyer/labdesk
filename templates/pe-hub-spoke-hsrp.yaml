annotations: []
smart_annotations:
- tag: labdesk-cloud
  is_on: true
  padding: 35
  label: labdesk-cloud
  tag_offset_x: 0
  tag_offset_y: 0
  tag_size: 14
  group_distance: 400
  thickness: 1
  border_style: ''
  fill_color: '#F16A2080'
  border_color: '#00000080'
  z_index: 1
nodes:
- boot_disk_size: null
  configuration:
  - name: ios_config.txt
    content: |-
      hostname HUB
      ! no service config: don't try to load configs over TFTP (belt-and-braces: Gi0/0 is an isolated link now)
      no service config
      no ip domain lookup
      ip domain name lab.local
      username admin privilege 15 secret cisco
      enable secret cisco
      !
      interface Loopback10
       description HUB LAN 192.168.10.0/24 (simulated with a loopback)
       ip address 192.168.10.1 255.255.255.0
      !
      interface GigabitEthernet0/0
       description WAN to PE ge-0/0/0 (via CML connector BR-PE-HUB, isolated link; PE routing-instance CUSTOMER)
       ip address 10.1.1.2 255.255.255.252
       no ip proxy-arp
       no shutdown
      !
      interface GigabitEthernet0/1
       description to INTERNET (LabDesk Internet cloud 100.64.0.1; CML connector INTERNET = System Bridge = host virbr0)
       ip address 100.64.0.2 255.255.255.0
       no ip proxy-arp
       no shutdown
      !
      ! --- Internet edge: the default route to the LabDesk Internet cloud (answers 8.8.8.8, 1.1.1.1, ...) ---
      ! No NAT: the cloud routes 10/8, 172.16/12, 192.168/16 back to 100.64.0.2 (its EDGE_GW = this router).
      ip route 0.0.0.0 0.0.0.0 100.64.0.1 name INTERNET
      !
      ! --- prefix-lists = the BGP filters ---
      ! HUB-LAN = what the HUB sends to the PE: its LAN + the default route (hub-and-spoke Internet via the hub)
      ip prefix-list HUB-LAN seq 10 permit 192.168.10.0/24
      ip prefix-list HUB-LAN seq 20 permit 0.0.0.0/0
      ip prefix-list BRANCH-LANS seq 10 permit 172.16.0.0/24
      ip prefix-list BRANCH-LANS seq 20 permit 192.168.20.0/24
      !
      ! --- which connected networks go into BGP (redistribute only, no "network" statements) ---
      ! "redistribute connected" would inject EVERY connected subnet (also the WAN /30 to the PE), so the
      ! route-map lets in only what CONNECTED-TO-BGP lists; seq 100 denies the rest (the WAN /30, ...).
      ! Redistributed routes carry BGP origin "incomplete" (shown as "?" instead of "i").
      ip prefix-list CONNECTED-TO-BGP description HUB LAN (Loopback10) only - nothing else connected may enter BGP
      ip prefix-list CONNECTED-TO-BGP seq 10 permit 192.168.10.0/24
      route-map RM-CONNECTED-TO-BGP permit 10
       description inject the HUB LAN into BGP
       match ip address prefix-list CONNECTED-TO-BGP
      route-map RM-CONNECTED-TO-BGP deny 100
       description everything else connected (WAN /30, Internet 100.64.0.0/24, ...) stays out of BGP
      !
      ! --- which static routes go into BGP: only the default (redistribute static, no "network 0.0.0.0") ---
      ! IOS never redistributes 0.0.0.0/0 into BGP on its own: "default-information originate" under
      ! router bgp allows it; the route-map makes sure no other static route can follow it in.
      ip prefix-list DEFAULT-ONLY description the default route only
      ip prefix-list DEFAULT-ONLY seq 10 permit 0.0.0.0/0
      route-map RM-STATIC-TO-BGP permit 10
       description inject the default route (to the Internet cloud) into BGP
       match ip address prefix-list DEFAULT-ONLY
      route-map RM-STATIC-TO-BGP deny 100
       description any other static route stays out of BGP
      !
      router bgp 65100
       bgp router-id 192.168.10.1
       bgp log-neighbor-changes
       default-information originate
       redistribute connected route-map RM-CONNECTED-TO-BGP
       redistribute static route-map RM-STATIC-TO-BGP
       neighbor 10.1.1.1 remote-as 65000
       neighbor 10.1.1.1 description PE (vrf CUSTOMER)
       neighbor 10.1.1.1 timers 5 15
       neighbor 10.1.1.1 prefix-list BRANCH-LANS in
       neighbor 10.1.1.1 prefix-list HUB-LAN out
      !
      ! First boot after a wipe (empty NVRAM): IOS AutoInstall DHCPs on every port with carrier. Gi0/1 sits on
      ! virbr0 where libvirt's dnsmasq answers, so it would end up with 192.168.122.x instead of 100.64.0.2
      ! (Gi0/0 is an isolated link now: kept as belt-and-braces). When CML's day-0 loader logs
      ! CVAC-4-CONFIG_DONE (or PnP stops; AutoInstall is over by then), this applet puts both static addresses
      ! back, creates the RSA key for SSH (answers "no" if one already exists) and saves.
      event manager applet LAB-DAY0-FIX
       event syslog pattern "CVAC-4-CONFIG_DONE|PNP-6-PNP_DISCOVERY_STOPPED" maxrun 240
       action 1.0 cli command "enable"
       action 2.0 cli command "configure terminal"
       action 3.0 cli command "interface GigabitEthernet0/0"
       action 3.1 cli command "ip address 10.1.1.2 255.255.255.252"
       action 3.2 cli command "exit"
       action 3.3 cli command "interface GigabitEthernet0/1"
       action 3.4 cli command "ip address 100.64.0.2 255.255.255.0"
       action 3.5 cli command "no shutdown"
       action 3.6 cli command "exit"
       action 4.0 cli command "crypto key generate rsa general-keys modulus 2048" pattern "yes/no|#"
       action 4.1 cli command "no"
       action 5.0 cli command "ip ssh version 2"
       action 6.0 cli command "end"
       action 7.0 cli command "write memory"
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       exec-timeout 30 0
       logging synchronous
       login local
       transport input ssh telnet
      !
      end
