lab:
  description: Juniper PE (vrf CUSTOMER) + Cisco hub + 2 Cisco spokes with HSRP/track,
    eBGP with prefix-list filters
  notes: |-
    PE = Juniper vJunos VM "PE" on host KVM (not a CML node), routing-instance CUSTOMER (vrf, AS 65000).
    PE ge-0/0/0 10.1.1.1/30 <-> BR-PE-HUB <-> HUB Gi0/0 10.1.1.2 (AS 65100, LAN 192.168.10.0/24 on Lo10)
    PE ge-0/0/1 10.1.2.1/30 <-> BR-PE-R1  <-> R1 Gi0/0 10.1.2.2 (AS 65200)
    PE ge-0/0/2 10.1.3.1/30 <-> BR-PE-R2  <-> R2 Gi0/0 10.1.3.2 (AS 65200, iBGP R1-R2 over DATA LAN)
