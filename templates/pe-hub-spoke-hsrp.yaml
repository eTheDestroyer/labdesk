  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          ! no service config: don't try to load configs over TFTP (belt-and-braces: Gi0/0 is an isolated link now)
          no service config
          no ip domain lookup
          ip domain name lab.local
          username admin privilege 15 secret cisco
          enable secret cisco
          !
          ! --- "proper track": is the WAN to the PE really usable? ---
          ! 1 = PE answers ping (IP SLA, every 5 s), 2 = WAN subinterface is up.
          ! 3 = both must be true (boolean AND); HSRP watches object 3.
          ip sla 1
           icmp-echo 10.1.2.1 source-interface GigabitEthernet0/0
           frequency 5
          ip sla schedule 1 life forever start-time now
          track 1 ip sla 1 reachability
           delay down 10 up 15
          track 2 interface GigabitEthernet0/0 line-protocol
          track 3 list boolean and
           object 1
           object 2
          !
          interface GigabitEthernet0/0
           description WAN to PE ge-0/0/1 (via CML connector BR-PE-R1, isolated link; PE routing-instance CUSTOMER)
           ip address 10.1.2.2 255.255.255.252
           no ip proxy-arp
           no shutdown
          !
          interface GigabitEthernet0/1
           description DATA LAN 172.16.0.0/24 (SW-DATA) - HSRP group 10
           ip address 172.16.0.2 255.255.255.0
           standby version 2
           standby 10 ip 172.16.0.1
           standby 10 priority 110
           standby 10 preempt delay minimum 15
           standby 10 name DATA
           standby 10 track 3 decrement 20
           no shutdown
          !
          interface GigabitEthernet0/2
           description PHONE LAN 192.168.20.0/24 (SW-PHONE) - HSRP group 20
           ip address 192.168.20.2 255.255.255.0
           standby version 2
           standby 20 ip 192.168.20.1
           standby 20 priority 100
           standby 20 preempt delay minimum 15
           standby 20 name PHONE
           no shutdown
          !
          ! --- prefix-lists = the BGP filters ---
          ip prefix-list BRANCH-OUT seq 10 permit 172.16.0.0/24
          ip prefix-list BRANCH-OUT seq 20 permit 192.168.20.0/24
          ip prefix-list HUB-IN seq 10 permit 192.168.10.0/24
          ip prefix-list DATA-LAN seq 10 permit 172.16.0.0/24
          ip prefix-list PHONE-LAN seq 10 permit 192.168.20.0/24
          !
          ! Path symmetry: R1 is HSRP primary for DATA, so it makes the other LAN look longer (AS-path prepend)
          ! and the PE / HUB send return traffic for each LAN to the router that is HSRP active for it.
          route-map TO-PE permit 10
           match ip address prefix-list DATA-LAN
          route-map TO-PE permit 20
           match ip address prefix-list PHONE-LAN
           set as-path prepend 65200 65200
          !
          router bgp 65200
           bgp router-id 172.16.0.2
           bgp log-neighbor-changes
           network 172.16.0.0 mask 255.255.255.0
           network 192.168.20.0 mask 255.255.255.0
           neighbor 10.1.2.1 remote-as 65000
           neighbor 10.1.2.1 description PE (vrf CUSTOMER)
           neighbor 10.1.2.1 timers 5 15
           neighbor 10.1.2.1 prefix-list HUB-IN in
           neighbor 10.1.2.1 prefix-list BRANCH-OUT out
           neighbor 10.1.2.1 route-map TO-PE out
           neighbor 172.16.0.3 remote-as 65200
           neighbor 172.16.0.3 description iBGP to the other branch router (backup path to the hub)
           neighbor 172.16.0.3 update-source GigabitEthernet0/1
           neighbor 172.16.0.3 timers 5 15
           neighbor 172.16.0.3 next-hop-self
           neighbor 172.16.0.3 prefix-list HUB-IN in
           neighbor 172.16.0.3 prefix-list HUB-IN out
          !
          ! Belt-and-braces (written when Gi0/0 sat on virbr0 with libvirt DHCP; the link is isolated now):
          ! first boot after a wipe (empty NVRAM): IOS AutoInstall could take a DHCP lease on Gi0/0
          ! and replaces the WAN address, and the SSH key does not exist yet. When CML's day-0 loader logs
          ! CVAC-4-CONFIG_DONE (AutoInstall is over by then), this applet puts the WAN address back,
          ! creates the RSA key for SSH (answers "no" if one already exists) and saves.
          event manager applet LAB-DAY0-FIX
           event syslog pattern "CVAC-4-CONFIG_DONE" maxrun 240
           action 1.0 cli command "enable"
           action 2.0 cli command "configure terminal"
           action 3.0 cli command "interface GigabitEthernet0/0"
           action 3.1 cli command "ip address 10.1.2.2 255.255.255.252"
           action 3.2 cli command "exit"
           action 4.0 cli command "crypto key generate rsa general-keys modulus 2048" pattern "yes/no|#"
           action 4.1 cli command "no"
           action 5.0 cli command "ip ssh version 2"
           action 6.0 cli command "end"
           action 7.0 cli command "write memory"
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           exec-timeout 30 0
           logging synchronous
           login local
           transport input ssh telnet
          !
          end
