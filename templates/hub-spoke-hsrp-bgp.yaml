lab:
  title: Hub-Spoke HSRP BGP ACL
  version: 0.3.0
  description: 2 hubs (HSRP LAN redundancy, iBGP) + 2 dual-homed spokes (eBGP primary/backup WAN) with ACLs
  notes: |-
    AS 65000 = HUB1/HUB2, AS 65001 = SPOKE1, AS 65002 = SPOKE2
    DC LAN 10.0.0.0/24, HSRP VIP 10.0.0.1 (HUB1 active pri 110, HUB2 standby 100)
    WAN primary via HUB1 (local-pref 200 on spokes, AS-path prepend toward HUB2)
    ACLs: spoke-to-spoke blocked on hubs, BGP prefix filtering, VTY restricted
    Login on all routers: admin / cisco
nodes:
  - id: n0
    label: HUB1
    node_definition: iosv
    x: -200
    y: -100
    configuration: |-
      hostname HUB1
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      !
      track 1 interface GigabitEthernet0/1 line-protocol
      track 2 interface GigabitEthernet0/2 line-protocol
      track 10 list boolean or
       object 1
       object 2
      !
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0
       description DC-LAN
       ip address 10.0.0.2 255.255.255.0
       standby version 2
       standby 1 ip 10.0.0.1
       standby 1 priority 110
       standby 1 preempt delay minimum 30
       standby 1 timers 1 3
       standby 1 authentication md5 key-string HSRPkey
       standby 1 track 10 decrement 20
       no shutdown
      !
      interface GigabitEthernet0/1
       description WAN-PRIMARY-to-SPOKE1
       ip address 172.16.11.1 255.255.255.252
       ip access-group SPOKE-ISOLATION in
       no shutdown
      !
      interface GigabitEthernet0/2
       description WAN-PRIMARY-to-SPOKE2
       ip address 172.16.12.1 255.255.255.252
       ip access-group SPOKE-ISOLATION in
       no shutdown
      !
      interface GigabitEthernet0/3
       description HUB-INTERCONNECT-to-HUB2
       ip address 172.16.0.1 255.255.255.252
       no shutdown
      !
      ip prefix-list DC-OUT seq 10 permit 10.0.0.0/24
      ip prefix-list FROM-SPOKE1 seq 10 permit 10.1.1.0/24
      ip prefix-list FROM-SPOKE2 seq 10 permit 10.2.2.0/24
      !
      ip access-list extended SPOKE-ISOLATION
       remark --- block branch-to-branch, allow everything else (incl. BGP) ---
       deny   ip 10.1.1.0 0.0.0.255 10.2.2.0 0.0.0.255 log
       deny   ip 10.2.2.0 0.0.0.255 10.1.1.0 0.0.0.255 log
       permit ip any any
      !
      ip access-list standard MGMT
       permit 10.0.0.0 0.0.0.255
       permit 172.16.0.0 0.0.255.255
       deny   any log
      !
      router bgp 65000
       bgp router-id 1.1.1.1
       bgp log-neighbor-changes
       timers bgp 5 15
       network 10.0.0.0 mask 255.255.255.0
       neighbor 172.16.0.2 remote-as 65000
       neighbor 172.16.0.2 description iBGP-HUB2
       neighbor 172.16.0.2 next-hop-self
       neighbor 172.16.11.2 remote-as 65001
       neighbor 172.16.11.2 description SPOKE1-primary
       neighbor 172.16.11.2 password BGPkey
       neighbor 172.16.11.2 prefix-list FROM-SPOKE1 in
       neighbor 172.16.12.2 remote-as 65002
       neighbor 172.16.12.2 description SPOKE2-primary
       neighbor 172.16.12.2 password BGPkey
       neighbor 172.16.12.2 prefix-list FROM-SPOKE2 in
      !
      line vty 0 4
       access-class MGMT in
       login local
       transport input telnet ssh
      line con 0
       logging synchronous
       exec-timeout 0 0
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical}
      - {id: i3, label: GigabitEthernet0/3, slot: 3, type: physical}
  - id: n1
    label: HUB2
    node_definition: iosv
    x: 200
    y: -100
    configuration: |-
      hostname HUB2
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      !
      interface Loopback0
       ip address 2.2.2.2 255.255.255.255
      !
      interface GigabitEthernet0/0
       description DC-LAN
       ip address 10.0.0.3 255.255.255.0
       standby version 2
       standby 1 ip 10.0.0.1
       standby 1 priority 100
       standby 1 preempt
       standby 1 timers 1 3
       standby 1 authentication md5 key-string HSRPkey
       no shutdown
      !
      interface GigabitEthernet0/1
       description WAN-BACKUP-to-SPOKE1
       ip address 172.16.21.1 255.255.255.252
       ip access-group SPOKE-ISOLATION in
       no shutdown
      !
      interface GigabitEthernet0/2
       description WAN-BACKUP-to-SPOKE2
       ip address 172.16.22.1 255.255.255.252
       ip access-group SPOKE-ISOLATION in
       no shutdown
      !
      interface GigabitEthernet0/3
       description HUB-INTERCONNECT-to-HUB1
       ip address 172.16.0.2 255.255.255.252
       no shutdown
      !
      ip prefix-list FROM-SPOKE1 seq 10 permit 10.1.1.0/24
      ip prefix-list FROM-SPOKE2 seq 10 permit 10.2.2.0/24
      !
      route-map BACKUP-OUT permit 10
       set as-path prepend 65000 65000 65000
      !
      ip access-list extended SPOKE-ISOLATION
       remark --- block branch-to-branch, allow everything else (incl. BGP) ---
       deny   ip 10.1.1.0 0.0.0.255 10.2.2.0 0.0.0.255 log
       deny   ip 10.2.2.0 0.0.0.255 10.1.1.0 0.0.0.255 log
       permit ip any any
      !
      ip access-list standard MGMT
       permit 10.0.0.0 0.0.0.255
       permit 172.16.0.0 0.0.255.255
       deny   any log
      !
      router bgp 65000
       bgp router-id 2.2.2.2
       bgp log-neighbor-changes
       timers bgp 5 15
       network 10.0.0.0 mask 255.255.255.0
       neighbor 172.16.0.1 remote-as 65000
       neighbor 172.16.0.1 description iBGP-HUB1
       neighbor 172.16.0.1 next-hop-self
       neighbor 172.16.21.2 remote-as 65001
       neighbor 172.16.21.2 description SPOKE1-backup
       neighbor 172.16.21.2 password BGPkey
       neighbor 172.16.21.2 prefix-list FROM-SPOKE1 in
       neighbor 172.16.21.2 route-map BACKUP-OUT out
       neighbor 172.16.22.2 remote-as 65002
       neighbor 172.16.22.2 description SPOKE2-backup
       neighbor 172.16.22.2 password BGPkey
       neighbor 172.16.22.2 prefix-list FROM-SPOKE2 in
       neighbor 172.16.22.2 route-map BACKUP-OUT out
      !
      line vty 0 4
       access-class MGMT in
       login local
       transport input telnet ssh
      line con 0
       logging synchronous
       exec-timeout 0 0
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical}
      - {id: i3, label: GigabitEthernet0/3, slot: 3, type: physical}
  - id: n2
    label: SPOKE1
    node_definition: iosv
    x: -200
    y: 150
    configuration: |-
      hostname SPOKE1
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      !
      interface Loopback0
       ip address 11.11.11.11 255.255.255.255
      !
      interface GigabitEthernet0/0
       description WAN-PRIMARY-to-HUB1
       ip address 172.16.11.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/1
       description WAN-BACKUP-to-HUB2
       ip address 172.16.21.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/2
       description BRANCH1-LAN
       ip address 10.1.1.1 255.255.255.0
       no shutdown
      !
      ip prefix-list LAN-OUT seq 10 permit 10.1.1.0/24
      !
      route-map PRIMARY-IN permit 10
       set local-preference 200
      route-map BACKUP-OUT permit 10
       match ip address prefix-list LAN-OUT
       set as-path prepend 65001 65001 65001
      !
      ip access-list standard MGMT
       permit 10.0.0.0 0.0.0.255
       permit 10.1.1.0 0.0.0.255
       deny   any log
      !
      router bgp 65001
       bgp router-id 11.11.11.11
       bgp log-neighbor-changes
       timers bgp 5 15
       network 10.1.1.0 mask 255.255.255.0
       neighbor 172.16.11.1 remote-as 65000
       neighbor 172.16.11.1 description HUB1-primary
       neighbor 172.16.11.1 password BGPkey
       neighbor 172.16.11.1 prefix-list LAN-OUT out
       neighbor 172.16.11.1 route-map PRIMARY-IN in
       neighbor 172.16.21.1 remote-as 65000
       neighbor 172.16.21.1 description HUB2-backup
       neighbor 172.16.21.1 password BGPkey
       neighbor 172.16.21.1 route-map BACKUP-OUT out
      !
      line vty 0 4
       access-class MGMT in
       login local
       transport input telnet ssh
      line con 0
       logging synchronous
       exec-timeout 0 0
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical}
  - id: n3
    label: SPOKE2
    node_definition: iosv
    x: 200
    y: 150
    configuration: |-
      hostname SPOKE2
      no ip domain lookup
      username admin privilege 15 secret cisco
      enable secret cisco
      !
      interface Loopback0
       ip address 22.22.22.22 255.255.255.255
      !
      interface GigabitEthernet0/0
       description WAN-PRIMARY-to-HUB1
       ip address 172.16.12.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/1
       description WAN-BACKUP-to-HUB2
       ip address 172.16.22.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/2
       description BRANCH2-LAN
       ip address 10.2.2.1 255.255.255.0
       no shutdown
      !
      ip prefix-list LAN-OUT seq 10 permit 10.2.2.0/24
      !
      route-map PRIMARY-IN permit 10
       set local-preference 200
      route-map BACKUP-OUT permit 10
       match ip address prefix-list LAN-OUT
       set as-path prepend 65002 65002 65002
      !
      ip access-list standard MGMT
       permit 10.0.0.0 0.0.0.255
       permit 10.2.2.0 0.0.0.255
       deny   any log
      !
      router bgp 65002
       bgp router-id 22.22.22.22
       bgp log-neighbor-changes
       timers bgp 5 15
       network 10.2.2.0 mask 255.255.255.0
       neighbor 172.16.12.1 remote-as 65000
       neighbor 172.16.12.1 description HUB1-primary
       neighbor 172.16.12.1 password BGPkey
       neighbor 172.16.12.1 prefix-list LAN-OUT out
       neighbor 172.16.12.1 route-map PRIMARY-IN in
       neighbor 172.16.22.1 remote-as 65000
       neighbor 172.16.22.1 description HUB2-backup
       neighbor 172.16.22.1 password BGPkey
       neighbor 172.16.22.1 route-map BACKUP-OUT out
      !
      line vty 0 4
       access-class MGMT in
       login local
       transport input telnet ssh
      line con 0
       logging synchronous
       exec-timeout 0 0
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical}
  - id: n4
    label: DC-SW
    node_definition: unmanaged_switch
    x: 0
    y: -300
    interfaces:
      - {id: i0, label: port0, slot: 0, type: physical}
      - {id: i1, label: port1, slot: 1, type: physical}
      - {id: i2, label: port2, slot: 2, type: physical}
  - id: n5
    label: SRV1
    node_definition: alpine
    x: 0
    y: -450
    configuration: |-
      hostname SRV1
      ip addr add 10.0.0.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 10.0.0.1
    interfaces:
      - {id: i0, label: eth0, slot: 0, type: physical}
  - id: n6
    label: BR1-SW
    node_definition: unmanaged_switch
    x: -200
    y: 320
    interfaces:
      - {id: i0, label: port0, slot: 0, type: physical}
  - id: n7
    label: BR2-SW
    node_definition: unmanaged_switch
    x: 200
    y: 320
    interfaces:
      - {id: i0, label: port0, slot: 0, type: physical}
links:
  - {id: l0, n1: n0, i1: i0, n2: n4, i2: i0}
  - {id: l1, n1: n1, i1: i0, n2: n4, i2: i1}
  - {id: l2, n1: n5, i1: i0, n2: n4, i2: i2}
  - {id: l3, n1: n0, i1: i3, n2: n1, i2: i3}
  - {id: l4, n1: n0, i1: i1, n2: n2, i2: i0}
  - {id: l5, n1: n1, i1: i1, n2: n2, i2: i1}
  - {id: l6, n1: n0, i1: i2, n2: n3, i2: i0}
  - {id: l7, n1: n1, i1: i2, n2: n3, i2: i1}
  - {id: l8, n1: n2, i1: i2, n2: n6, i2: i0}
  - {id: l9, n1: n3, i1: i2, n2: n7, i2: i0}
