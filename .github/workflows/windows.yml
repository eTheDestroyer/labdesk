name: Build LabDesk.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # the release job attaches LabDesk.exe to a GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 openssh-client
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  windows:
    name: Tests + LabDesk.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run the tests that apply to Windows
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"            # LabDesk.exe runs in Python UTF-8 mode (labdesk.spec): test the same way
        run: python -m pytest -q tests

      - name: Build LabDesk.exe
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          "$ver $("${{ github.sha }}".Substring(0,7))".Trim() | Out-File -Encoding utf8NoBOM BUILD_INFO
          pyinstaller --noconfirm --clean labdesk.spec
          Get-Item dist\LabDesk.exe | Format-List Name, Length

      - name: Smoke test - main window (offscreen, quits after 10 s)
        shell: pwsh
        run: |
          $cred = Join-Path $env:RUNNER_TEMP "cml-credentials.env"
          "CML_HOST=192.0.2.1`nCML_ADMIN_USER=admin`nCML_ADMIN_PASS=not-a-real-password" | Out-File -Encoding ascii $cred
          $env:CML_CRED_FILE = $cred
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LABDESK_SMOKE_EXIT_MS = "10000"
          $env:LABDESK_SMOKE_FILE = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $p = Start-Process -FilePath dist\LabDesk.exe -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "LabDesk.exe did not quit" }
          $log = Join-Path $env:LOCALAPPDATA "LabDesk\cache\labdesk.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "LabDesk.exe exited with code $($p.ExitCode)" }
          if (-not (Test-Path $env:LABDESK_SMOKE_FILE)) { throw "the main window never came up" }
          Get-Content $env:LABDESK_SMOKE_FILE

      - name: Smoke test - first run (connection dialog stays open for 10 s)
        shell: pwsh
        run: |
          $env:CML_CRED_FILE = Join-Path $env:RUNNER_TEMP "missing\cml-credentials.env"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\LabDesk.exe -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "LabDesk\cache\labdesk.log"
            if (Test-Path $log) { Get-Content $log }
            throw "LabDesk.exe exited early with code $($p.ExitCode)"
          }
          Get-CimInstance Win32_Process -Filter "Name = 'LabDesk.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          "still running after 10 s - ok"

      - uses: actions/upload-artifact@v4
        with:
          name: LabDesk-windows
          path: dist/LabDesk.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LabDesk-windows
      - name: Create the release with LabDesk.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" LabDesk.exe --repo "${{ github.repository }}" \
            --title "LabDesk ${{ github.ref_name }}" \
            --notes "LabDesk for Windows 10/11: download **LabDesk.exe** and run it (see INSTALL.md, section *Windows*). The file is not code-signed: Windows SmartScreen may say *Windows protected your PC*; click **More info → Run anyway**. Linux users: install from the repository with ./install.sh."
